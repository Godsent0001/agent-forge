[package]
name = "agentforge"
version = "0.1.0"
description = "AgentForge desktop agent builder"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3.0"

[[bin]]
name = "agentforge"
path = "src/main.rs"
