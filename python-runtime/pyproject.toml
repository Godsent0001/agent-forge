[project]
name = "agentforge-runtime"
version = "0.1.0"
description = "AgentForge Python agent runtime (FastAPI backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic>=2.7.1",
    "python-multipart>=0.0.20",
    # Explicit multipart parser for streaming upload endpoints.
    "pillow>=12.3.0",
    "litellm>=1.100.0",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
# Local speech-to-text for videos that have no captions (clip_finder fallback).
transcribe = ["faster-whisper>=1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
build = ["pyinstaller>=6.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls a real LLM (manual only)", "evals: evaluation tasks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
