name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: cd python-runtime && uv sync --group dev
      - run: cd python-runtime && uv run ruff check .
      - run: cd python-runtime && uv run pytest -m "not live"
      - name: Validate FakeRunner fixture export
        run: cd python-runtime && uv run python scripts/export_fixtures.py
      - name: Validate tool CLI entry point
        run: cd python-runtime && uv run python scripts/try_tool.py --help

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: npm ci
      - name: Build Linux desktop package and bundled Python sidecar
        run: npm run dist
      - name: Verify packaged application artifacts
        run: |
          test -d dist-electron
          find dist-electron -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \) -print -quit | grep -q .
          # The bundled ffmpeg/ffprobe must ship inside the app and run.
          test -x dist-electron/linux-unpacked/resources/ffmpeg/ffmpeg
          test -x dist-electron/linux-unpacked/resources/ffmpeg/ffprobe
          dist-electron/linux-unpacked/resources/ffmpeg/ffmpeg -hide_banner -version | head -1
          dist-electron/linux-unpacked/resources/ffmpeg/ffprobe -hide_banner -version | head -1
          # LGPL build: no GPL-only libx264, H.264 via openh264 (what the media tools select).
          ! dist-electron/linux-unpacked/resources/ffmpeg/ffmpeg -hide_banner -encoders | grep -q libx264
          dist-electron/linux-unpacked/resources/ffmpeg/ffmpeg -hide_banner -buildconf | grep -q -- --enable-version3
          ! dist-electron/linux-unpacked/resources/ffmpeg/ffmpeg -hide_banner -buildconf | grep -q -- --enable-gpl
          dist-electron/linux-unpacked/resources/ffmpeg/ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=25:duration=1 -c:v libopenh264 -b:v 1M -pix_fmt yuv420p "$RUNNER_TEMP/openh264.mp4"
          dist-electron/linux-unpacked/resources/ffmpeg/ffprobe -v error -show_entries stream=codec_name -of csv=p=0 "$RUNNER_TEMP/openh264.mp4" | grep -qx h264
          test -f dist-electron/linux-unpacked/resources/ffmpeg/LICENSE.txt
      - uses: actions/upload-artifact@v6
        with:
          name: agentforge-linux-package
          path: dist-electron/*
          if-no-files-found: error
          retention-days: 7
