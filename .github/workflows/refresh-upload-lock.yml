name: Refresh upload dependency lock (temporary)

on:
  push:
    branches: [dev/kenny-ui]
    paths:
      - "python-runtime/pyproject.toml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/kenny-ui
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Regenerate Python lockfile and remove temporary workflow
        run: |
          uv lock --directory python-runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python-runtime/uv.lock
          git rm .github/workflows/refresh-upload-lock.yml
          git commit -m "chore(deps): lock multipart upload parser"
          git push origin HEAD:dev/kenny-ui
