name: ruff-fix
on:
  push:
    branches: ["dev/kenny-ui"]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/kenny-ui
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: git fetch origin dev/kenny-ui
      - run: git reset --hard origin/dev/kenny-ui
      - run: cd python-runtime && uv sync --frozen --group dev
      - run: cd python-runtime && uv run ruff check . --fix
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python-runtime
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply Ruff import baseline fixes [skip ci]"
          git push origin HEAD:dev/kenny-ui
